<svg width="420" height="100" viewBox="0 0 420 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Ship + Arrow Icon -->
  <g transform="translate(10,20)">
    <!-- Hull -->
    <polygon points="0,40 90,40 75,60 15,60" fill="#0a1f2f"/>
    
    <!-- Containers -->
    <rect x="10" y="20" width="15" height="15" fill="#06b6d4"/>
    <rect x="30" y="15" width="15" height="20" fill="#10b981"/>
    <rect x="50" y="20" width="15" height="15" fill="#06b6d4"/>

    <!-- Upward Arrow (growth) -->
    <polyline points="5,50 25,35 45,40 70,20" 
      fill="none" stroke="#10b981" stroke-width="3"/>
    <polygon points="70,20 65,22 68,27" fill="#10b981"/>
  </g>

  <!-- Text -->
  <text x="120" y="45" font-family="Inter, sans-serif" font-size="28" fill="#0a1f2f" font-weight="700">
    TILGroup
  </text>
  <text x="120" y="70" font-family="Inter, sans-serif" font-size="14" fill="#06b6d4">
    Digital Securities
  </text>
</svg>
